plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tvremote'
version = '0.1.0'

android {
  namespace "expo.modules.tvremote"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google Play in-app updates; 2.1.0 is the latest and is required for apps targeting Android 14+.
  implementation 'com.google.android.play:app-update:2.1.0'
}
